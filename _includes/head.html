<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | default: "Dott.ssa Mara Micolucci - Dietista" }}</title>
<meta name="description" content="{{ page.description | default: site.description | default: 'Dietista, Farmacista, Dott.ssa in Scienze e Tecniche Psicologiche. Consulenze online e in presenza.' }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">

<!-- ONLY new stylesheet, old legacy CSS removed as requested -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v=5">

{% assign ga_id = site.google_analytics | default: site.ga4_id | default: site.ga_id %}
{% if ga_id %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','{{ ga_id }}');</script>
{% endif %}
{% if site.meta_pixel_id %}
<script>!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init','{{ site.meta_pixel_id }}');fbq('track','PageView');</script>
{% endif %}

<link rel="icon" href="{{ '/assets/images/mara-micolucci.jpg' | relative_url }}">
<meta property="og:image" content="{{ '/assets/images/mara-micolucci.jpg' | relative_url | absolute_url }}">
